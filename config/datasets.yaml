# =============================================================================
# datasets.yaml — Dataset Configuration
# =============================================================================
#
# Each top-level key is a dataset name, which maps directly to:
#   - input:  data/raw/{name}.csv
#   - output: data/processed/{name}.csv
#
# FIELDS:
#   features      List of input column names (in the same order as the CSV)
#   target        Target column name
#
# PREPROCESSING:
#   binarize_target:
#     enabled     Set to true to binarize the target column
#     threshold   Values >= threshold → 1, values < threshold → 0
#
#   numeric / categorical:
#     columns     Columns to apply the steps to
#     steps       Ordered list of preprocessing steps to apply
#
#   Available numeric steps:
#     - impute_median     Fill missing values with column median
#     - impute_mean       Fill missing values with column mean
#     - standard_scale    Standardize to zero mean and unit variance
#     - minmax_scale      Scale to [0, 1] range
#
#   Available categorical steps:
#     - impute_mode       Fill missing values with most frequent value
#     - onehot_encode     One-hot encode the column
#
# ADDING A NEW DATASET:
#   1. Place the raw CSV in data/raw/{name}.csv
#   2. Add a new entry below following the same structure
#   3. Run Dataset("{name}", cfg="config/datasets.yaml").run()
#
# =============================================================================

heart_disease:
  features: [age, sex, cp, trestbps, chol, fbs, restecg, thalach, exang, oldpeak, slope, ca, thal]
  target: num
  preprocessing:
    binarize_target:
      enabled: true
      threshold: 1
    numeric:
      columns: [age, sex, cp, trestbps, chol, fbs, restecg, thalach, exang, oldpeak, slope, ca, thal]
      steps:
        - impute_median
        - standard_scale
    categorical:
      columns: []
      steps: []

diabetes:
  features: [Pregnancies, Glucose, BloodPressure, SkinThickness, Insulin, BMI, DiabetesPedigreeFunction, Age]
  target: Outcome
  preprocessing:
    binarize_target:
      enabled: false
      threshold: null
    numeric:
      columns: [Pregnancies, Glucose, BloodPressure, SkinThickness, Insulin, BMI, DiabetesPedigreeFunction, Age]
      steps:
        - impute_median
        - standard_scale
    categorical:
      columns: []
      steps: []

maternal_health_risk:
  features: [Age, SystolicBP, DiastolicBP, BS, BodyTemp, HeartRate]
  target: RiskLevel
  preprocessing:
    binarize_target:
      enabled: true
      threshold: 1
    numeric:
      columns: [Age, SystolicBP, DiastolicBP, BS, BodyTemp, HeartRate]
      steps:
        - impute_median
        - standard_scale
    categorical:
      columns: []
      steps: []

# The undeclared `Case Number` row identifier is dropped at load time — see the
# note in src/dataset.py load().
gestational_diabetes:
  features: [Age, No of Pregnancy, Gestation in previous Pregnancy, BMI, HDL, Family History, unexplained prenetal loss, Large Child or Birth Default, PCOS, Sys BP, Dia BP, OGTT, Hemoglobin, Sedentary Lifestyle, Prediabetes]
  target: Class Label(GDM /Non GDM)
  preprocessing:
    binarize_target:
      enabled: false
      threshold: null
    numeric:
      columns: [Age, No of Pregnancy, Gestation in previous Pregnancy, BMI, HDL, Sys BP, Dia BP, OGTT, Hemoglobin]
      steps:
        - impute_median
        - standard_scale
    categorical:
      columns: [Family History, unexplained prenetal loss, Large Child or Birth Default, PCOS, Sedentary Lifestyle, Prediabetes]
      steps: [impute_mode]

# `CLASS` (the 10-level morphologic pattern) is deliberately absent from `features`:
# it is a second label for the same recording and is dropped at load time. Keeping
# it would leak the target.
cardiotocography:
  features: [LB, AC, FM, UC, DL, DS, DP, ASTV, MSTV, ALTV, MLTV, Width, Min, Max, Nmax, Nzeros, Mode, Mean, Median, Variance, Tendency]
  target: NSP
  preprocessing:
    binarize_target:
      # NSP: 1 = Normal, 2 = Suspect, 3 = Pathologic. Threshold 2 splits normal
      # from any abnormality, matching how heart_disease and maternal_health_risk
      # binarize their ordinal targets.
      enabled: true
      threshold: 2
    numeric:
      columns: [LB, AC, FM, UC, DL, DS, DP, ASTV, MSTV, ALTV, MLTV, Width, Min, Max, Nmax, Nzeros, Mode, Mean, Median, Variance, Tendency]
      steps:
        - impute_median
        - standard_scale
    categorical:
      columns: []
      steps: []

# `BI-RADS` is deliberately absent from `features`: it is the radiologist's own
# assessment of the mass, labelled non-predictive by the dataset authors, and is
# dropped at load time.
mammographic_mass:
  features: [Age, Shape, Margin, Density]
  target: Severity
  preprocessing:
    binarize_target:
      enabled: false
      threshold: null
    numeric:
      columns: [Age, Shape, Margin, Density]
      steps:
        - impute_median
        - standard_scale
    categorical:
      columns: []
      steps: []

# `time` is deliberately absent from `features`: it is the follow-up duration in
# days, is not available at prediction time, and on its own dominates death_event.
# Dropped at load time.
heart_failure:
  features: [age, anaemia, creatinine_phosphokinase, diabetes, ejection_fraction, high_blood_pressure, platelets, serum_creatinine, serum_sodium, sex, smoking]
  target: death_event
  preprocessing:
    binarize_target:
      enabled: false
      threshold: null
    numeric:
      columns: [age, anaemia, creatinine_phosphokinase, diabetes, ejection_fraction, high_blood_pressure, platelets, serum_creatinine, serum_sodium, sex, smoking]
      steps:
        - impute_median
        - standard_scale
    categorical:
      columns: []
      steps: []
