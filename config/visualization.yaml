# =============================================================================
# visualization.yaml — Visualization Configuration
# =============================================================================

figures:
  dir: results/figures
  format: svg
  # Canvas width, in inches, for the figures placed at \textwidth. The Overleaf
  # document is elsarticle[preprint,12pt] on A4 with no geometry package, so
  # \the\textwidth is 390pt = 5.40in (measured; see
  # tmp/overleaf/figures/conceptual_overview/README.md).
  #
  # This is deliberately 25% WIDER than that (5.40 * 1.25), so a figure placed at
  # \includegraphics[width=\linewidth] is scaled to 0.8 on the page. Everything
  # shrinks by that factor together, which trades text size for drawing area: the
  # point sizes below land at 0.8x on the page (8pt ticks -> 6.4pt, still clear of the
  # 6pt floor), and in exchange the twelve-mode axis gets a quarter more room, so the
  # violins and the FHE-10/FHE-12 tick labels stop crowding. Set this to 5.40 to go
  # back to 1:1 rendering at full point size.
  page_width_in: 6.75

# seaborn style / context — controls overall look and element scaling
# style:   white | whitegrid | ticks | darkgrid
# context: paper | notebook | talk | poster
style: "white"
context: "paper"

fonts:
  family: "sans-serif"    # matplotlib font.family
  # Preference order for font.sans-serif. The manuscript loads \usepackage{helvet},
  # so matching Helvetica here makes figure text look native to the page. Any name
  # matplotlib cannot resolve is skipped, so the list runs Helvetica -> its metric
  # clones (Arial on Windows/macOS, Nimbus/Liberation Sans on Linux) -> DejaVu Sans,
  # which always exists but is visibly wider than the body text.
  sans_serif: ["Helvetica", "Arial", "Nimbus Sans", "Liberation Sans", "DejaVu Sans"]
  title_size: 15
  title_weight: "normal"
  label_size: 15
  tick_size: 13
  # Sizes for the multipanel figures. Those are generated at `page_width_in` and
  # placed at \textwidth, i.e. rendered 1:1, so these are true printed point sizes
  # and must stay above the 6pt floor journals enforce. The single-panel figures
  # above are scaled down on the page and so carry their own larger numbers.
  panel_tick_size: 8
  panel_label_size: 9

# Per-mode display labels and colors.
# Each mode belongs to a group (real / synthetic / fhe). A mode may set an explicit
# `color:` (used for synthetic methods, so each is distinct); otherwise its colour
# comes from the group's base_color (+ lightness_range shading, used by FHE).
modes:
  standard:
    label: "Real"
    group: real
  # Synthetic methods each get a distinct Okabe-Ito colorblind-safe hue so
  # lines/violins are easy to tell apart — no lightness shading here.
  gaussian_copula:
    label: "Gaussian Copula"
    group: synthetic
    color: "#9467bd"        # purple
  ctgan:
    label: "CTGAN"
    group: synthetic
    color: "#d55e00"        # vermilion
  bayesian_network:
    label: "Bayesian Network"
    group: synthetic
    color: "#cc79a7"        # mauve
  nflow:
    label: "Normalizing Flow"
    group: synthetic
    color: "#0072b2"        # blue (swapped with FHE — was too close to CTGAN)
  arf:
    label: "ARF"
    group: synthetic
    color: "#e69f00"        # orange
  fhe:
    label_prefix: "FHE"
    group: fhe

# Group-level color settings.
# Modes within a group share the base_color hue; lightness_range controls
# the auto-shading ramp when multiple modes are present in that group.
# [lightness_max, lightness_min] — lightest member first, darkest last.
groups:
  real:
    label: "Real"
    base_color: "#009e73"    # Okabe-Ito bluish green
  synthetic:
    label: "Synthetic"
    base_color: "#e07b2a"    # fallback only; per-method colors are set under `modes`
  fhe:
    label: "FHE"
    base_color: "#8c564b"    # brown (swapped with Normalizing Flow)
    # FHE keeps lightness shading by bit-width. The top of the range is capped at
    # 0.60 rather than the old 0.72: at L=0.72 the lightest step (FHE-2) sits at
    # 2.14:1 against white and all but disappears at print size. Over [0.60, 0.28]
    # the six steps run 3.15:1 to 10.0:1, so every one clears the 3:1 threshold while
    # the ramp keeps the same 3.2x spread that makes the bit-widths tellable apart.
    lightness_range: [0.60, 0.28]

# Per-model line colors for the FHE complexity-cost plots. That figure contains no
# mode colors, so this palette is independent of the mode colors above.
model_line_colors: ["#0072b2", "#d55e00", "#009e73", "#cc79a7", "#e69f00"]

# FHE training-time breakdown segment colors.
fhe_breakdown:
  fit_color: "#cccccc"            # "fit" segment (compile segment uses the FHE shade ramp)
  group_divider_color: "#dddddd"  # thin separator between model groups (multipanel)

# Grouping cue between mode groups (real / synthetic / FHE) on the violin panels.
#   style: shading -> a faint band behind each group, tinted with its base_color
#          line    -> the original dashed vertical rules on the group boundaries
#          both    -> shading plus the rules
# Shading reads more calmly than three dashed rules across a dense 12-mode axis and
# survives grayscale. As a side effect it gives the single-member `real` group its
# own band, which is what visually anchors the reference mode.
separators:
  enabled: true
  style: "shading"
  band_alpha: 0.07         # opacity of the group shading band
  linewidth: 0.8           # the settings below drive style: line | both
  color: "#cccccc"
  linestyle: "--"
  show_group_labels: true
  label_min_span: 2        # skip the header for a group of one (it duplicates its own code)
  group_label_fontsize: 13
  group_label_color: "#333333"

boxplot:
  alpha: 0.65
  linewidth: 0.8
  notch: false
  showmeans: false
  mean_marker_color: "#555555"
  mean_marker_size: 6
  strip_alpha: 0.25
  strip_size: 2.5
  grid_alpha: 0.15
  despine: true            # remove top and right spines

violinplot:
  # `alpha` is baked into the fill colours rather than applied to the finished
  # artists, so the outlines and the inner box stay fully opaque. Fading everything
  # uniformly is what made the violins look mushy at print size.
  alpha: 0.65
  linewidth: 0.8
  # `box` draws a miniature box-and-whisker with a white median dot, which reads at
  # a glance in a 1in-tall panel. `quartile` draws three dashed lines that turn into
  # noise once each violin is only ~0.4in wide.
  # Either way the marked centre is the MEDIAN, which is the project-wide point
  # estimate (see aggregate_metrics_csv in src/utils.py), so the dot inside a violin
  # and the number in the tables are the same statistic.
  # NOTE: switching this away from `quartile` invalidates the sentence in the
  # manuscript caption that describes the inner lines as quartiles.
  inner: "box"             # box | quartile | point | stick | None
  # 0 truncates each KDE at the observed data range. The default of 2 extends it two
  # bandwidths past the data, which for a bounded metric like ROC-AUC draws violins
  # that visibly exceed 1.0.
  cut: 0
  # Violin outline = its own fill darkened to this fraction of the fill's lightness,
  # so twelve differently coloured violins each get a crisp, colour-matched edge.
  edge_lightness: 0.62
  strip_alpha: 0.25
  strip_size: 2.5
  grid_alpha: 0.15
  grid_linewidth: 0.4
  grid_linestyle: ":"
  y_max_ticks: 4           # tick cap for the short multipanel panels (null = auto)
  despine: true            # remove top and right spines
  # Horizontal reference at the median of the Real mode. The figure exists to answer
  # "is this mode below real data", and without it the reader has to saccade back to
  # the leftmost violin for every one of the eleven comparisons.
  baseline:
    enabled: true
    color: "#6e6e6e"
    linestyle: "--"
    linewidth: 0.7
    band_alpha: 0.10       # faint band over Real's IQR; set to 0 for the line only

# Significance markers on the violin panels. A marker is drawn on every mode that
# is significantly WORSE than Real (analyses A1/A2 in results/stats/), and the
# tier is the strictest bound the Holm-corrected p clears.
#
# These thresholds are only reachable when the bootstrap has enough replicates:
# Holm multiplies the p-floor of 1/(B+1) by the family size, so at B=1000 the
# smallest attainable p_holm is ~0.005 and "***" can never be earned. B=10000
# puts the floor at ~0.0005 and all three tiers become reachable.
significance:
  levels:                  # marker: upper bound on the Holm-corrected p
    "***": 0.001
    "**":  0.01
    "*":   0.05

metrics:
  - accuracy
  - precision
  - recall
  - f1
  - roc_auc
  - train_time
  - inf_time_per_sample
  - mem_inf_peak
  - synth_fit_time

# Metrics plotted with a log-scaled y-axis (e.g. timing/memory metrics that
# can span orders of magnitude across modes). All other metrics use a linear axis.
log_scale_metrics:
  - inf_time_per_sample

# ROC multipanel axes window. These classifiers sit at ROC-AUC ~0.8-0.99, so the
# curves crowd into the upper-left corner and most of the unit square is empty;
# cropping to that corner quadruples effective resolution at unchanged panel size.
# Set `zoom: null` to restore the full unit square (which also restores the chance
# diagonal to the legend — y=x does not cross a cropped window).
roc:
  zoom: [0.0, 0.5, 0.5, 1.0]   # [fpr_min, fpr_max, tpr_min, tpr_max]

# Radar overview figure — one polar panel per mode, aggregated over all
# datasets x models. Performance axes fill the TOP half (absolute [0,1] band);
# resource-cost axes fill the BOTTOM half (log + min-max across the shown modes,
# inverted) so "outward = better" on every axis. The two group hues wash the two
# halves and are drawn from the Okabe-Ito palette, validated colorblind-safe (blue vs
# vermilion: CVD dE >= 21, both >= 3:1 contrast on white). The wash is skipped when
# `envelope: true`, where it would stack with the band into mud.
radar:
  perf_color: "#0072b2"        # performance group (Okabe-Ito blue)
  resource_color: "#d55e00"    # resource group (Okabe-Ito vermilion)
  poly_color: "#2b2b2b"        # per-mode polygon/band — neutral, identical every panel
  baseline_color: "#8a8a8a"    # Real reference polygon (dashed, non-Real panels)
  grid_color: "#cfcfcf"        # hairline rings, and spokes when the wash is off
  # Performance-axis normalization:
  #   minmax   -> per-axis min-max across the shown modes (lowest=0, highest=1)
  #   absolute -> map raw metric through perf_band (true magnitude, stable)
  perf_norm: minmax
  perf_band: [0.5, 1.0]        # radial band when perf_norm: absolute
  fhe_n_bits: 8                # which FHE bit-width gets a panel
  primary_synth: [arf, bayesian_network, ctgan, gaussian_copula, nflow]
  # Variability variant. false: each mode is its median polygon plus IQR whiskers.
  # true: each mode becomes a shaded p25-p75 band over the (dataset x model) cells
  # with no centre line. Real is the dashed median either way. One figure per run —
  # flip this and re-run to compare. Radii are not comparable between the two: the
  # median version fits its min-max ranges to the mode medians, the envelope to the
  # quantiles it draws (which overshoot on the resource axes).
  envelope: false
  envelope_quantiles: [25, 75]   # the two band edges
  envelope_band_alpha: 0.12      # band fill opacity
